<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="U16 Team 3">
<title>Stats - U16 Team 3</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #1a1a2e; --bg2: #16213e; --accent: #e8a838;
  --green: #2ecc71; --text: #f0f0f0; --muted: #999;
  --danger: #e74c3c; --blue: #3498db; --purple: #9b59b6; --orange: #e67e22;
}
html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; min-height: 100vh; }
#app { padding: 12px; max-width: 600px; margin: 0 auto; }
.screen { display: none; }
.screen.active { display: block; }

h1 { text-align: center; font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; padding: 10px 0 4px; }
.subtitle { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 16px; }

.player-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.player-row label { font-size: 13px; font-weight: 700; color: var(--muted); width: 32px; flex-shrink: 0; }
.player-row input { flex: 1; background: var(--bg2); border: 1px solid #444; color: var(--text); padding: 11px 12px; border-radius: 8px; font-size: 16px; font-weight: 600; -webkit-appearance: none; appearance: none; min-width: 0; }
.player-row input:focus { outline: none; border-color: var(--accent); }

.btn { border: none; border-radius: 8px; font-size: 17px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; -webkit-appearance: none; appearance: none; display: block; width: 100%; padding: 15px; margin-top: 12px; font-family: inherit; }
.btn-start { background: var(--accent); color: #1a1a2e; }
.btn-end { background: var(--danger); color: #fff; }
.btn:active { opacity: 0.75; }

.quarter-bar { display: flex; gap: 6px; margin-bottom: 10px; }
.q-btn { flex: 1; padding: 12px 0; border: 2px solid #444; background: var(--bg2); color: var(--muted); border-radius: 8px; font-size: 18px; font-weight: 800; cursor: pointer; -webkit-appearance: none; font-family: inherit; }
.q-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,168,56,0.12); }
.q-btn.done { border-color: #333; color: #444; }

.game-info { text-align: center; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.timer { font-size: 24px; font-weight: 800; color: var(--accent); }
.tap-hint { text-align: center; font-size: 11px; color: #555; margin-bottom: 8px; }

.players-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 10px; }
.p-btn { border: 2px solid #333; background: var(--bg2); color: var(--muted); border-radius: 8px; padding: 6px 2px; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; -webkit-appearance: none; -webkit-user-select: none; user-select: none; font-family: inherit; width: 100%; }
.p-btn .pname { font-size: 13px; font-weight: 700; line-height: 1.2; word-break: break-word; text-align: center; }
.p-btn .ptime { font-size: 10px; color: var(--muted); font-weight: 600; }
.p-btn .phint { font-size: 9px; color: #444; }
.p-btn.on { border-color: var(--green); color: var(--green); background: rgba(46,204,113,0.1); }
.p-btn.on .ptime { color: #7dda9e; }
.p-btn.on .phint { color: #3a7a52; }
.p-btn.sel { border-color: var(--accent); color: var(--accent); background: rgba(232,168,56,0.12); }
.p-btn.on.sel { border-color: var(--accent); color: var(--accent); background: rgba(232,168,56,0.12); }

.stat-panel { background: var(--bg2); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.stat-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
.sel-name { font-size: 20px; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 10px; min-height: 26px; letter-spacing: 1px; text-transform: uppercase; }
.stat-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.s-btn { padding: 14px 4px; border: 2px solid; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; text-transform: uppercase; line-height: 1.2; -webkit-appearance: none; font-family: inherit; background: transparent; }
.s-btn:active { opacity: 0.6; }
.s-btn.oreb { border-color: var(--orange); color: var(--orange); }
.s-btn.dreb { border-color: var(--blue); color: var(--blue); }
.s-btn.ast  { border-color: var(--purple); color: var(--purple); }
.s-btn:disabled { opacity: 0.25; }

.totals { display: flex; gap: 6px; margin-top: 10px; }
.tot { flex: 1; background: rgba(255,255,255,0.04); border-radius: 6px; padding: 6px; text-align: center; font-size: 10px; color: var(--muted); }
.tot span { font-size: 22px; font-weight: 800; color: var(--text); display: block; }

.log-wrap { background: var(--bg2); border-radius: 8px; padding: 8px; max-height: 80px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
.log-line { font-size: 10px; color: var(--muted); border-bottom: 1px solid #222; padding: 2px 0; }
.log-line:last-child { color: #bbb; border-bottom: none; }

.undo-btn { background: transparent; border: 1px solid #444; color: var(--muted); border-radius: 6px; padding: 8px 16px; font-size: 12px; cursor: pointer; display: block; margin: 0 auto 8px; font-family: inherit; }

.report-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.back-btn { background: var(--bg2); border: 1px solid #444; color: var(--muted); border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit; }
.tabs { display: flex; gap: 5px; margin-bottom: 12px; }
.tab { flex: 1; padding: 10px 4px; border: 1px solid #444; background: var(--bg2); color: var(--muted); border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase; -webkit-appearance: none; font-family: inherit; }
.tab.active { border-color: var(--accent); color: var(--accent); background: rgba(232,168,56,0.1); }

.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 300px; font-size: 12px; }
th { padding: 8px 4px; font-size: 10px; font-weight: 700; color: var(--muted); text-align: center; border-bottom: 1px solid #333; text-transform: uppercase; white-space: nowrap; }
th:first-child { text-align: left; }
td { padding: 7px 4px; text-align: center; border-bottom: 1px solid #222; white-space: nowrap; }
td:first-child { text-align: left; color: var(--accent); font-weight: 700; font-size: 11px; }
tr:last-child td { border-bottom: none; }
.hi { color: var(--accent); font-weight: 800; }

/* CSS BAR CHARTS */
.chart-section { margin-bottom: 20px; }
.chart-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.bar-chart { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 6px; }
.bar-name { font-size: 10px; color: var(--muted); width: 60px; flex-shrink: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; background: #252540; border-radius: 3px; height: 22px; position: relative; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; min-width: 2px; transition: width 0.4s; }
.bar-fill span { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.9); white-space: nowrap; }
.bar-fill-stacked { height: 100%; display: flex; }
.bar-seg { height: 100%; display: flex; align-items: center; justify-content: center; }
.bar-seg span { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.85); }

.export-btn { background: #0f3460; color: var(--text); border: 1px solid var(--accent); border-radius: 8px; padding: 12px; width: 100%; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; font-family: inherit; }
.note { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 12px; }
.pct-note { font-size: 11px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">

  <div id="scr-setup" class="screen active">
    <h1>Stats - U16 Team 3</h1>
    <p class="subtitle">Tap a name to edit, then press Start</p>
    <div id="player-inputs"></div>
    <button class="btn btn-start" id="start-btn">Start Game</button>
  </div>

  <div id="scr-track" class="screen">
    <h1>Stats - U16 Team 3</h1>
    <div class="quarter-bar" id="qbar"></div>
    <div class="game-info">
      <span id="qlabel">Select a quarter</span> &nbsp;|&nbsp; <span class="timer" id="timer">00:00</span>
    </div>
    <p class="tap-hint">Tap = select player &nbsp;|&nbsp; Double-tap = sub on/off</p>
    <div class="players-grid" id="pgrid"></div>
    <div class="stat-panel">
      <div class="stat-label">Record stat for</div>
      <div class="sel-name" id="selname">— tap a player —</div>
      <div class="stat-btns">
        <button class="s-btn oreb" id="btn-oreb" onclick="recStat('oreb')" disabled>Offensive Rebound</button>
        <button class="s-btn dreb" id="btn-dreb" onclick="recStat('dreb')" disabled>Defensive Rebound</button>
        <button class="s-btn ast"  id="btn-ast"  onclick="recStat('ast')"  disabled>Assist</button>
      </div>
      <div class="totals">
        <div class="tot"><span id="tot-oreb">0</span>Off Reb</div>
        <div class="tot"><span id="tot-dreb">0</span>Def Reb</div>
        <div class="tot"><span id="tot-ast">0</span>Assists</div>
      </div>
    </div>
    <button class="undo-btn" onclick="undoLast()">&#8617; Undo last stat</button>
    <div class="log-wrap" id="logpanel"></div>
    <button class="btn btn-end" onclick="endGame()">End Game &amp; View Report</button>
  </div>

  <div id="scr-report" class="screen">
    <div class="report-header">
      <button class="back-btn" onclick="show('scr-track')">&#8592; Back</button>
      <h1 style="font-size:18px;padding:0">Game Report</h1>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-raw"   onclick="switchTab('raw')">Raw Stats</button>
      <button class="tab"        id="tab-chart" onclick="switchTab('chart')">Charts</button>
      <button class="tab"        id="tab-pct"   onclick="switchTab('pct')">% of Team</button>
    </div>
    <div id="tc-raw"></div>
    <div id="tc-chart" style="display:none"></div>
    <div id="tc-pct"   style="display:none"></div>
    <button class="export-btn" onclick="exportCSV()">&#8595; Export CSV for MATLAB</button>
    <p class="note">% of team = each player's share of total team stats for the game.</p>
  </div>

</div>
<script>
var QUARTERS = ['Q1','Q2','Q3','Q4'];
var players = [];
var selPlayer = null;
var curQ = null;
var qActive = false;
var timerIv = null;
var timerStart = null;
var elapsed = 0;
var statHist = [];
var tapTmr = {};

function ftime(s) {
  var m = Math.floor(s/60), sec = s % 60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

(function() {
  var wrap = document.getElementById('player-inputs');
  for (var i = 0; i < 10; i++) {
    var row = document.createElement('div');
    row.className = 'player-row';
    var lbl = document.createElement('label');
    lbl.textContent = '#'+(i+1);
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.id = 'p'+i;
    inp.value = 'Player '+(i+1);
    inp.addEventListener('focus', function(){ this.select(); });
    inp.addEventListener('touchstart', function(){ var t=this; setTimeout(function(){t.select();},50); }, {passive:true});
    row.appendChild(lbl);
    row.appendChild(inp);
    wrap.appendChild(row);
  }
  document.getElementById('start-btn').addEventListener('click', startGame);
})();

function startGame() {
  players = [];
  for (var i = 0; i < 10; i++) {
    var el = document.getElementById('p'+i);
    var nm = el ? (el.value || '').trim() : '';
    if (!nm) nm = 'Player '+(i+1);
    players.push({name:nm, on:false, sec:0, inTime:null, oreb:0, dreb:0, ast:0});
  }
  buildTrack();
  show('scr-track');
}

function buildTrack() {
  var qbar = document.getElementById('qbar');
  qbar.innerHTML = '';
  for (var qi = 0; qi < QUARTERS.length; qi++) {
    (function(q) {
      var b = document.createElement('button');
      b.className = 'q-btn';
      b.id = 'q-'+q;
      b.textContent = q;
      b.addEventListener('click', function(){ toggleQ(q); });
      qbar.appendChild(b);
    })(QUARTERS[qi]);
  }
  var grid = document.getElementById('pgrid');
  grid.innerHTML = '';
  for (var i = 0; i < players.length; i++) {
    (function(idx) {
      var b = document.createElement('button');
      b.className = 'p-btn';
      b.id = 'pb'+idx;
      b.innerHTML = '<span class="pname">'+players[idx].name+'</span><span class="ptime" id="pt'+idx+'">0:00</span><span class="phint">dbl-tap:sub</span>';
      b.addEventListener('click', function(){ handleTap(idx); });
      grid.appendChild(b);
    })(i);
  }
}

function handleTap(i) {
  if (tapTmr[i]) {
    clearTimeout(tapTmr[i]);
    delete tapTmr[i];
    toggleSub(i);
  } else {
    tapTmr[i] = setTimeout(function() {
      delete tapTmr[i];
      selFor(i);
    }, 280);
  }
}

function toggleSub(i) {
  var p = players[i];
  var btn = document.getElementById('pb'+i);
  var now = Date.now();
  if (p.on) {
    if (qActive && p.inTime) p.sec += Math.round((now - p.inTime)/1000);
    p.on = false; p.inTime = null;
    btn.classList.remove('on');
    log(p.name+' subbed off ('+(p.sec/60).toFixed(1)+' min)');
  } else {
    p.on = true; p.inTime = qActive ? now : null;
    btn.classList.add('on');
    log(p.name+' subbed on');
  }
  refreshTimes();
}

function toggleQ(q) {
  var btn = document.getElementById('q-'+q);
  if (qActive && curQ !== q) {
    endQ();
    document.getElementById('q-'+curQ).className = 'q-btn done';
    log(curQ+' ended');
  }
  if (curQ === q && qActive) {
    endQ();
    btn.className = 'q-btn done';
    document.getElementById('qlabel').textContent = q+' ended';
    log(q+' ended');
    return;
  }
  curQ = q; qActive = true;
  for (var qi = 0; qi < QUARTERS.length; qi++) {
    var b = document.getElementById('q-'+QUARTERS[qi]);
    if (QUARTERS[qi] !== q && !b.classList.contains('done')) b.className = 'q-btn';
  }
  btn.className = 'q-btn active';
  document.getElementById('qlabel').textContent = q+' in progress';
  log(q+' started');
  startTimer();
}

function endQ() {
  qActive = false; stopTimer();
  var now = Date.now();
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.on && p.inTime) { p.sec += Math.round((now - p.inTime)/1000); p.inTime = now; }
  }
}

function startTimer() {
  clearInterval(timerIv);
  timerStart = Date.now() - elapsed*1000;
  timerIv = setInterval(function() {
    elapsed = Math.round((Date.now()-timerStart)/1000);
    document.getElementById('timer').textContent = ftime(elapsed);
  }, 1000);
}
function stopTimer() { clearInterval(timerIv); }

function selFor(i) {
  selPlayer = i;
  var btns = document.querySelectorAll('.p-btn');
  for (var j = 0; j < btns.length; j++) {
    if (j === i) btns[j].classList.add('sel'); else btns[j].classList.remove('sel');
  }
  document.getElementById('selname').textContent = players[i].name;
  document.getElementById('btn-oreb').disabled = false;
  document.getElementById('btn-dreb').disabled = false;
  document.getElementById('btn-ast').disabled  = false;
}

function recStat(stat) {
  if (selPlayer === null) return;
  players[selPlayer][stat]++;
  statHist.push({p: selPlayer, s: stat});
  log(players[selPlayer].name+': +1 '+stat.toUpperCase());
  refreshTotals();
}

function undoLast() {
  if (!statHist.length) return;
  var last = statHist.pop();
  players[last.p][last.s]--;
  log('Undo: '+last.s.toUpperCase()+' from '+players[last.p].name);
  refreshTotals();
}

function refreshTotals() {
  var stats = ['oreb','dreb','ast'];
  for (var si = 0; si < stats.length; si++) {
    var s = stats[si], t = 0;
    for (var i = 0; i < players.length; i++) t += players[i][s];
    document.getElementById('tot-'+s).textContent = t;
  }
}

function refreshTimes() {
  var now = Date.now();
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    var s = p.sec;
    if (p.on && qActive && p.inTime) s += Math.round((now - p.inTime)/1000);
    var el = document.getElementById('pt'+i);
    if (el) el.textContent = ftime(s);
  }
}

function log(msg) {
  var lp = document.getElementById('logpanel');
  var d = document.createElement('div');
  d.className = 'log-line';
  d.textContent = ftime(elapsed)+'  '+msg;
  lp.appendChild(d);
  lp.scrollTop = lp.scrollHeight;
}

function endGame() {
  stopTimer();
  var now = Date.now();
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.on && p.inTime) { p.sec += Math.round((now-p.inTime)/1000); p.inTime=null; p.on=false; }
  }
  buildRaw(); buildPct(); buildCharts();
  show('scr-report');
}

function buildRaw() {
  var mO=0,mD=0,mA=0;
  for (var i=0;i<players.length;i++) {
    if(players[i].oreb>mO)mO=players[i].oreb;
    if(players[i].dreb>mD)mD=players[i].dreb;
    if(players[i].ast>mA)mA=players[i].ast;
  }
  var h = '<div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Min</th><th style="color:#e67e22">Off Reb</th><th style="color:#3498db">Def Reb</th><th style="color:#9b59b6">Assists</th><th>Tot Reb</th></tr></thead><tbody>';
  var tO=0,tD=0,tA=0;
  for (var i=0;i<players.length;i++) {
    var p=players[i];
    tO+=p.oreb; tD+=p.dreb; tA+=p.ast;
    h+='<tr><td>'+p.name+'</td><td>'+(p.sec/60).toFixed(1)+'</td>';
    h+='<td class="'+(p.oreb===mO&&mO>0?'hi':'')+'">'+p.oreb+'</td>';
    h+='<td class="'+(p.dreb===mD&&mD>0?'hi':'')+'">'+p.dreb+'</td>';
    h+='<td class="'+(p.ast===mA&&mA>0?'hi':'')+'">'+p.ast+'</td>';
    h+='<td>'+(p.oreb+p.dreb)+'</td></tr>';
  }
  h+='<tr style="border-top:1px solid #444"><td style="color:#888">Team</td><td>-</td><td>'+tO+'</td><td>'+tD+'</td><td>'+tA+'</td><td>'+(tO+tD)+'</td></tr>';
  h+='</tbody></table></div>';
  document.getElementById('tc-raw').innerHTML = h;
}

function buildPct() {
  var tO=0,tD=0,tA=0,tR=0;
  for(var i=0;i<players.length;i++){tO+=players[i].oreb;tD+=players[i].dreb;tA+=players[i].ast;tR+=players[i].oreb+players[i].dreb;}
  var mO=0,mD=0,mA=0,mR=0;
  for(var i=0;i<players.length;i++){
    if(players[i].oreb>mO)mO=players[i].oreb;
    if(players[i].dreb>mD)mD=players[i].dreb;
    if(players[i].ast>mA)mA=players[i].ast;
    if(players[i].oreb+players[i].dreb>mR)mR=players[i].oreb+players[i].dreb;
  }
  var h='<p class="pct-note">Each player\'s share of the team\'s total stats for the game.</p>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Min</th><th style="color:#e67e22">Off%</th><th style="color:#3498db">Def%</th><th style="color:#9b59b6">Ast%</th><th>Reb%</th></tr></thead><tbody>';
  for(var i=0;i<players.length;i++){
    var p=players[i], r=p.oreb+p.dreb;
    var pO=tO>0?Math.round(p.oreb/tO*100)+'%':'-';
    var pD=tD>0?Math.round(p.dreb/tD*100)+'%':'-';
    var pA=tA>0?Math.round(p.ast/tA*100)+'%':'-';
    var pR=tR>0?Math.round(r/tR*100)+'%':'-';
    h+='<tr><td>'+p.name+'</td><td>'+(p.sec/60).toFixed(1)+'</td>';
    h+='<td class="'+(p.oreb===mO&&mO>0?'hi':'')+'">'+pO+'</td>';
    h+='<td class="'+(p.dreb===mD&&mD>0?'hi':'')+'">'+pD+'</td>';
    h+='<td class="'+(p.ast===mA&&mA>0?'hi':'')+'">'+pA+'</td>';
    h+='<td class="'+(r===mR&&mR>0?'hi':'')+'">'+pR+'</td></tr>';
  }
  h+='</tbody></table></div>';
  document.getElementById('tc-pct').innerHTML = h;
}

function makeBar(label, value, maxVal, color) {
  var pct = maxVal > 0 ? Math.round((value/maxVal)*100) : 0;
  var row = document.createElement('div');
  row.className = 'bar-row';
  var nm = document.createElement('div');
  nm.className = 'bar-name';
  nm.title = label;
  nm.textContent = label;
  var track = document.createElement('div');
  track.className = 'bar-track';
  var fill = document.createElement('div');
  fill.className = 'bar-fill';
  fill.style.width = pct+'%';
  fill.style.background = color;
  if (value > 0) {
    var lbl = document.createElement('span');
    lbl.textContent = value;
    fill.appendChild(lbl);
  }
  track.appendChild(fill);
  row.appendChild(nm);
  row.appendChild(track);
  return row;
}

function makeStackedBar(label, val1, val2, max12) {
  var tot = val1 + val2;
  var pct = max12 > 0 ? Math.round((tot/max12)*100) : 0;
  var row = document.createElement('div');
  row.className = 'bar-row';
  var nm = document.createElement('div');
  nm.className = 'bar-name';
  nm.title = label;
  nm.textContent = label;
  var track = document.createElement('div');
  track.className = 'bar-track';
  var stack = document.createElement('div');
  stack.className = 'bar-fill-stacked';
  stack.style.width = pct+'%';
  stack.style.height = '100%';
  if (val1 > 0) {
    var s1 = document.createElement('div');
    s1.className = 'bar-seg';
    s1.style.background = '#e67e22';
    s1.style.flex = val1;
    var l1 = document.createElement('span');
    l1.textContent = val1;
    s1.appendChild(l1);
    stack.appendChild(s1);
  }
  if (val2 > 0) {
    var s2 = document.createElement('div');
    s2.className = 'bar-seg';
    s2.style.background = '#3498db';
    s2.style.flex = val2;
    var l2 = document.createElement('span');
    l2.textContent = val2;
    s2.appendChild(l2);
    stack.appendChild(s2);
  }
  track.appendChild(stack);
  row.appendChild(nm);
  row.appendChild(track);
  return row;
}

function buildCharts() {
  var maxReb=0, maxAst=0, maxMin=0;
  for(var i=0;i<players.length;i++){
    var r=players[i].oreb+players[i].dreb;
    if(r>maxReb)maxReb=r;
    if(players[i].ast>maxAst)maxAst=players[i].ast;
    var m=players[i].sec/60;
    if(m>maxMin)maxMin=m;
  }

  var wrap = document.getElementById('tc-chart');
  wrap.innerHTML = '';

  var s1 = document.createElement('div'); s1.className='chart-section';
  var t1 = document.createElement('div'); t1.className='chart-title'; t1.textContent='Rebounds by player (orange=offensive, blue=defensive)';
  var b1 = document.createElement('div'); b1.className='bar-chart';
  for(var i=0;i<players.length;i++) b1.appendChild(makeStackedBar(players[i].name, players[i].oreb, players[i].dreb, maxReb));
  s1.appendChild(t1); s1.appendChild(b1); wrap.appendChild(s1);

  var s2 = document.createElement('div'); s2.className='chart-section';
  var t2 = document.createElement('div'); t2.className='chart-title'; t2.textContent='Assists by player';
  var b2 = document.createElement('div'); b2.className='bar-chart';
  for(var i=0;i<players.length;i++) b2.appendChild(makeBar(players[i].name, players[i].ast, maxAst, '#9b59b6'));
  s2.appendChild(t2); s2.appendChild(b2); wrap.appendChild(s2);

  var s3 = document.createElement('div'); s3.className='chart-section';
  var t3 = document.createElement('div'); t3.className='chart-title'; t3.textContent='Minutes played';
  var b3 = document.createElement('div'); b3.className='bar-chart';
  for(var i=0;i<players.length;i++) {
    var mins = parseFloat((players[i].sec/60).toFixed(1));
    b3.appendChild(makeBar(players[i].name, mins, maxMin, '#e8a838'));
  }
  s3.appendChild(t3); s3.appendChild(b3); wrap.appendChild(s3);
}

function switchTab(t) {
  var tabs = ['raw','chart','pct'];
  for(var i=0;i<tabs.length;i++){
    document.getElementById('tab-'+tabs[i]).className='tab'+(tabs[i]===t?' active':'');
    document.getElementById('tc-'+tabs[i]).style.display=tabs[i]===t?'block':'none';
  }
}

function exportCSV() {
  var tO=0,tD=0,tA=0,tR=0;
  for(var i=0;i<players.length;i++){tO+=players[i].oreb;tD+=players[i].dreb;tA+=players[i].ast;tR+=players[i].oreb+players[i].dreb;}
  var rows=[['Player','MinutesPlayed','OffReb','DefReb','TotalReb','Assists','OffReb_Pct','DefReb_Pct','TotalReb_Pct','Assists_Pct']];
  for(var i=0;i<players.length;i++){
    var p=players[i], r=p.oreb+p.dreb;
    rows.push([p.name,(p.sec/60).toFixed(2),p.oreb,p.dreb,r,p.ast,
      tO>0?((p.oreb/tO)*100).toFixed(1):'0',
      tD>0?((p.dreb/tD)*100).toFixed(1):'0',
      tR>0?((r/tR)*100).toFixed(1):'0',
      tA>0?((p.ast/tA)*100).toFixed(1):'0']);
  }
  var csv='';
  for(var i=0;i<rows.length;i++) csv+=rows[i].join(',')+'\n';
  var blob = new Blob([csv],{type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='game_stats.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function show(id) {
  var screens = document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

setInterval(refreshTimes, 5000);
</script>
